services:
  stockpay-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockpay
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: stockpay
    volumes:
      - stockpay-db-data:/var/lib/postgresql/data
    networks:
      - stockpay-net
    # Sin "ports": igual que n8n-postgres, solo alcanzable desde la red de Docker.

  stockpay-backend:
    build:
      context: ./carniceria-api
    container_name: stockpay-backend
    restart: unless-stopped
    depends_on:
      - stockpay-db
    environment:
      DATABASE_URL: postgresql://stockpay:${DB_PASSWORD}@stockpay-db:5432/stockpay
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    ports:
      - "8083:3001"
    networks:
      - stockpay-net

networks:
  stockpay-net:

volumes:
  stockpay-db-data:
